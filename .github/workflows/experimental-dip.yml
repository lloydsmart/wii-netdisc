name: Experimental DIP sizing

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full reviewed commit SHA approved for this execution
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify owner dispatch and workflow revision
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REPOSITORY" == lloydsmart/wii-netdisc ]]
          [[ "$GITHUB_REPOSITORY_OWNER" == lloydsmart ]]
          [[ "$GITHUB_ACTOR" == lloydsmart && "$GITHUB_TRIGGERING_ACTOR" == lloydsmart ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 && "$GITHUB_REF" == refs/heads/develop ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/experimental-dip.yml@$GITHUB_REF" ]]
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$APPROVED_SHA" && "$GITHUB_WORKFLOW_SHA" == "$APPROVED_SHA" ]]
          echo "Approved workflow and event revision $APPROVED_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false

      - name: Verify checkout
        id: approved_checkout
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: test "$(git rev-parse HEAD)" = "$APPROVED_SHA"

      - name: Record runner and measurement revision
        run: |
          mkdir "$RUNNER_TEMP/dip-sizing-inputs" "$RUNNER_TEMP/dip-sizing-evidence"
          python3 -B - <<'PYTHON'
          import os
          from pathlib import Path
          from scripts.experimental_dip_evidence import Journal
          journal = Journal(Path(os.environ["RUNNER_TEMP"]) / "dip-sizing-evidence/sizing.jsonl")
          journal.write("stage", "approval")
          journal.write("revision", "checkout", os.environ["GITHUB_SHA"])
          for field, key in (("image", "ImageOS"), ("version", "ImageVersion"),
                             ("run", "GITHUB_RUN_ID"), ("attempt", "GITHUB_RUN_ATTEMPT")):
              value = os.environ[key]
              journal.write("runner", field, int(value) if field in ("run", "attempt") else value)
          journal.write("runner", "uid", os.getuid())
          PYTHON

      - name: Provision native build and r32 runtime dependencies
        id: provision
        timeout-minutes: 7
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get install -y --no-install-recommends \
            g++ make binutils libfl2 libelf1t64 libmpc3 libmpfr6 libgmp10 zlib1g

      - name: Retrieve pinned public inputs
        id: retrieve
        timeout-minutes: 5
        run: |
          cd "$RUNNER_TEMP/dip-sizing-inputs"
          git init -q d2x
          git -C d2x fetch --depth=1 --no-tags https://github.com/wiidev/d2x-cios.git \
            33ad1eeeb8f562df99e7d7ca428fdd36e0e31be7
          release=https://github.com/Leseratte10/compile-devkitARM-r32/releases/download/2020-02-20
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 90 \
            "$release/devkitARM-r32-linux_debian-buster.tar.gz" -o r32.tar.gz

      - name: Build the matched control and measure one experimental link
        id: build_pair
        timeout-minutes: 15
        run: |
          D2X_REPO="$RUNNER_TEMP/dip-sizing-inputs/d2x" R32_ARCHIVE="$RUNNER_TEMP/dip-sizing-inputs/r32.tar.gz" \
            WORK_DIR="$RUNNER_TEMP/dip-sizing" SIZING_JOURNAL_DIR="$RUNNER_TEMP/dip-sizing-evidence" \
            make experimental-dip-sizing

      - name: Select validated text evidence
        id: collect
        if: ${{ !cancelled() && steps.approved_checkout.outcome == 'success' }}
        env:
          PROVISION: ${{ steps.provision.outcome }}
          RETRIEVE: ${{ steps.retrieve.outcome }}
          MEASURE: ${{ steps.build_pair.outcome }}
        run: |
          python3 -B - <<'PYTHON'
          import os
          from pathlib import Path
          from scripts.experimental_dip_evidence import Journal
          journal = Journal(Path(os.environ["RUNNER_TEMP"]) / "dip-sizing-evidence/sizing.jsonl")
          for step in ("provision", "retrieve", "measure"):
              journal.write("workflow", step, os.environ[step.upper()])
          PYTHON
          python3 -B -m scripts.experimental_dip_evidence "$RUNNER_TEMP"

      - name: Retain text evidence
        if: ${{ !cancelled() && steps.collect.outputs.ready == 'true' }}
        timeout-minutes: 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dip-sizing-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/dip-sizing-public/
